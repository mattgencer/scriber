name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: FedericoCarboni/setup-ffmpeg@v3
        if: runner.os != 'macOS'  # the action has no Apple Silicon build

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      # Windows and Linux lock to CUDA 12.8 torch (multi-GB). CI has no GPU, so install the CPU build instead.
      - name: Install dependencies (CPU torch)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          uv sync --frozen --no-install-package torch --no-install-package torchaudio --no-install-package torchvision
          uv pip install "torch==2.8.0" "torchaudio==2.8.0" "torchvision==0.23.0" --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Type check
        run: uv run --no-sync mypy src

      - name: Tests
        run: uv run --no-sync pytest -q
