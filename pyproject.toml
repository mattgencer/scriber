[project]
name = "scriber"
version = "0.1.0"
description = "Transcribe audio and video to text, subtitles and JSON with speaker labels, locally (WhisperX)."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Matt Gencer" }
]
# whisperx 3.8 caps Python below 3.14.
requires-python = ">=3.13,<3.14"
dependencies = [
    "whisperx",
    # Same ranges whisperx 3.8 requires. Stated here so the resolver never picks a newer torch and downgrades whisperx.
    "torch~=2.8.0",
    "torchaudio~=2.8.0",
    "torchvision~=0.23.0",
    "typer",
    "pydantic-settings",
    "platformdirs",
]

[project.scripts]
scriber = "scriber.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
]

# CUDA 12.8 builds of torch (needed for RTX 50-series / Blackwell; PyPI's Windows wheels are CPU-only) exist only
# for Windows and Linux. macOS takes the regular PyPI wheels (Apple Silicon; Intel Macs have no torch 2.8 wheels).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }
torchaudio = { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs CUDA GPU and model downloads (slow)"]
